<!doctype html>
<html lang="et"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tuleva · Kodukindlustuse ühishange</title>
<style>
:root{--navy:#092454;--blue:#0067ff;--muted:#60718b;--line:#dce5f1;--mint:#def5e9}*{box-sizing:border-box}body{margin:0;font:16px/1.6 Arial,sans-serif;color:var(--navy);background:#f7faff}button,input,select{font:inherit}button,a{cursor:pointer}button{border:0;border-radius:9px;padding:13px 22px;font-weight:700;background:var(--blue);color:white}button:hover{filter:brightness(.94)}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:white;color:var(--blue);border:1px solid var(--line)}.text{background:none;color:var(--blue);padding:6px}.danger{color:#bd3951}.demo{font-size:12px;letter-spacing:.05em;background:var(--navy);color:#fff;text-align:center;padding:7px}header{background:white;border-bottom:1px solid var(--line);padding:22px 5%;display:flex;align-items:center;gap:40px}.logo{font-size:32px;font-weight:700;letter-spacing:-2px}.logo span{color:#00a2b8}nav{display:flex;gap:30px;font-size:14px;flex:1}nav b{color:var(--blue)}.account{font-size:14px}main{max-width:1100px;margin:auto;padding:48px 24px 70px}h1,h2,h3,p{margin-top:0}h1{font:700 clamp(36px,5vw,62px)/1.1 Georgia,serif;letter-spacing:-1.5px;margin-bottom:22px}h2{font:700 30px/1.2 Georgia,serif}h3{font-size:19px;margin-bottom:8px}.muted{color:var(--muted)}.pill{display:inline-block;border-radius:40px;background:#e3efff;color:var(--blue);font-size:12px;font-weight:700;padding:7px 15px}.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:40px;align-items:center;padding:28px 0 40px}.hero p{font-size:20px;max-width:530px}.house{background:#e5f3ff;border-radius:50%;padding:25px}.metrics,.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.metric,.card{background:white;border:1px solid var(--line);border-radius:15px;padding:26px}.metric strong{display:block;font:700 38px Georgia;color:var(--blue)}.card p{margin-bottom:0}.steps{display:flex;gap:12px;margin-bottom:36px;font-size:13px;flex-wrap:wrap}.steps span{padding:8px 14px;border-radius:30px;background:#eaf0f8;color:var(--muted)}.steps .active{background:var(--navy);color:white}.intro{max-width:760px}.member{display:flex;gap:16px;align-items:center;background:#edf3fa;border-radius:12px;padding:18px;margin:25px 0}.avatar{width:44px;height:44px;display:grid;place-items:center;background:#d6e9ff;border-radius:50%;color:var(--blue);font-weight:bold}.home{border:1px solid var(--line);border-radius:13px;background:white;margin:16px 0;padding:24px}.home.selected{border-color:var(--blue);background:#fafdff}.home-top{display:flex;justify-content:space-between;gap:20px}.address{font-size:20px;font-weight:bold}.details{font-size:14px;color:var(--muted);margin:8px 0 18px}.choice{display:flex;gap:12px;align-items:flex-start;cursor:pointer}input[type=checkbox]{accent-color:var(--blue);width:20px;height:20px;flex-shrink:0}input:not([type=checkbox]),select{width:100%;padding:12px;border:1px solid #ccd8e8;border-radius:7px;color:var(--navy);background:white}label{display:block;font-size:14px}.notice{background:#eaf3ff;border-radius:12px;padding:22px;margin:24px 0}.actions{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-top:25px}.success{width:64px;height:64px;border-radius:50%;background:var(--mint);color:#16704d;font-size:34px;text-align:center;margin-bottom:22px}.code{background:var(--navy);color:white;border-radius:16px;padding:30px;display:flex;justify-content:space-between;align-items:center;gap:20px;margin:30px 0}.code strong{font-size:28px;letter-spacing:2px}.insurers{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.insurer{text-align:left;background:white;border:1px solid var(--line);color:var(--navy);padding:28px}.insurer strong{display:block;font-size:28px;margin-bottom:10px}.insurer small{color:var(--blue)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.iflogo{font:bold 62px Georgia;color:#005caa}.footer{border-top:1px solid var(--line);padding:20px;text-align:center;font-size:12px;color:var(--muted)}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;border-radius:10px;padding:12px 22px;display:none}a{color:var(--blue)}@media(max-width:720px){nav{display:none}header{gap:20px;padding:15px 20px}.account{margin-left:auto}.hero{grid-template-columns:1fr}.house{display:none}.metrics,.cards,.insurers{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.actions,.code{align-items:stretch;flex-direction:column}main{padding-top:28px}.home-top{gap:10px}.address{font-size:17px}}
</style></head><body><div class="demo">KLIKITAV PROTOTÜÜP · kõik aadressid ja isikukood on väljamõeldud · päringuid ei saadeta</div><header><div class="logo"><span>⌁</span>Tuleva</div><nav><span>II sammas⌄</span><span>III sammas⌄</span><b>Kodukindlustus</b><span>Ühistu⌄</span><span>Meist⌄</span></nav><div id="account" class="account"></div></header><main id="app"></main><div class="footer">Tuleva kodukindlustuse ühishanke prototüüp · 25% on näidissoodustus, mitte siduv kindlustuspakkumine.</div><div id="toast" role="status"></div>
<script>
const app=document.querySelector('#app');let page='landing',addressConsent=false,consent=false,queried=false,accepted=false,company='IF';const code='TULEVA-TONU-25';const homes=[{id:0,address:'Pärnaõie tn 18–7, Tallinn',type:'Korter',area:68,selected:false,removed:false},{id:1,address:'Kadakamarja tee 24, Tartu',type:'Eramu',area:124,selected:true,removed:false},{id:2,address:'Rannakivi põik 6–12, Pärnu',type:'Korter',area:54,selected:true,removed:false},{id:3,address:'Metsaoja tee 9, Viljandi vald',type:'Suvila',area:46,selected:false,removed:false}];
function go(p){page=p;location.hash=p==='insurer'?'kindlustusselts/'+company.toLowerCase():p;render();window.scrollTo(0,0)}function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',2600)}
function steps(n){return '<div class="steps">'+['Kodu valik','Osalemissoov','Sooduskood ja selts','Kindlustustaotlus'].map((x,i)=>`<span class="${i===n?'active':''}">${i+1}. ${x}</span>`).join('')+'</div>'}function member(){return '<div class="member"><div class="avatar">TP</div><div><b>Tõnu Pekk</b> <span class="pill">Tuleva liige</span><br><small class="muted">Isikukood: 60001019999 · väljamõeldud demoandmed</small></div></div>'}
function selected(){return homes.filter(h=>h.selected&&!h.removed&&(h.id===0||queried))}function home(h,registry=false){return `<div class="home ${h.selected?'selected':''}"><div class="home-top"><div class="address">⌂ ${h.address}</div>${registry?`<button class="text danger" onclick="removeHome(${h.id})">Eemalda</button>`:'<span class="pill">Minu aadress</span>'}</div><div class="details">${h.type} · ${h.area} m² · ${registry?'kinnistusregistri näidisvastus':'liikmeprofiili näidisandmed'}</div><label class="choice"><input type="checkbox" ${h.selected?'checked':''} onchange="choose(${h.id},this.checked)"><span>Soovin seda kodu kindlustada</span></label></div>`}function choose(id,v){homes[id].selected=v;render()}function removeHome(id){homes[id].removed=true;homes[id].selected=false;render()}function reset(){addressConsent=false;consent=false;queried=false;accepted=false;homes.forEach((h,i)=>{h.removed=false;h.selected=i===1||i===2});go('landing')}
function render(){const external=page==='insurer'||page==='done';document.querySelector('.logo').innerHTML=external?'<span style="color:#005caa;font-family:Georgia">'+(company==='IF'?'if':company)+'</span>':'<span>⌁</span>Tuleva';document.querySelector('nav').style.display=external?'none':'';document.querySelector('.demo').textContent=external?'KINDLUSTUSSELTSI ERALDI NÄIDISLEHT · MITTEAMETLIK DEMO · andmeid ei saadeta':'KLIKITAV PROTOTÜÜP · aadressid ja isikukood on väljamõeldud · päringuid ei saadeta';document.querySelector('#account').innerHTML=page==='landing'?'<button class="secondary" onclick="go(\'homes\')">Logi sisse</button>':'<span>● Tõnu Pekk</span> <button class="text" onclick="reset()">Alusta uuesti</button>';let html='';
if(page==='landing')html=`<div class="hero"><div><span class="pill">TULEVA LIIKMETELE</span><h1 style="margin-top:24px">Kodukindlustus.<br>Ühiselt soodsam.</h1><p class="muted">Ühendame ostujõu. Kindlustame kodud soodsamalt.</p><button onclick="go('homes')">Logi sisse ja osale →</button><p style="font-size:12px;margin-top:12px" class="muted">Demo sisselogimine Tõnu Pekina</p></div><div class="house"><svg viewBox="0 0 350 300" aria-label="Kodu illustratsioon"><circle cx="175" cy="150" r="140" fill="#daeeff"/><path d="M50 260h260" stroke="#8bc9dc" stroke-width="4"/><path d="M83 145L176 57l95 88" fill="none" stroke="#0a397c" stroke-width="14" stroke-linejoin="round"/><path d="M98 136l78-72 79 72v124H98z" fill="white"/><path d="M176 64l79 72v124h-79z" fill="#f0f7ff"/><path d="M220 90V52h20v57" fill="#0a397c"/><path d="M145 202h43v58h-43z" fill="#0067ff"/><g fill="#a5d9ff" stroke="#0067ff" stroke-width="3"><path d="M128 143h28v35h-28zM205 143h28v35h-28zM208 207h25v31h-25z"/></g><path d="M285 257v-94" stroke="#14747c" stroke-width="5"/><ellipse cx="285" cy="154" rx="31" ry="56" fill="#78cbb7"/><path d="M285 225v-80" stroke="#14747c" stroke-width="3"/><circle cx="78" cy="247" r="25" fill="#68bfae"/><circle cx="273" cy="254" r="18" fill="#18a1b1"/></svg></div></div><div class="metrics"><div class="metric"><strong>1000+</strong>liiget on esmane eesmärk</div><div class="metric"><strong>25%</strong>näidissoodustus liikmele</div><div class="metric"><strong>5</strong>kindlustusseltsi valikus</div></div><div class="cards" style="margin-top:24px"><div class="card"><h3>Ühine ostujõud</h3><p class="muted">Koondame liikmete soovid ühte pakkumispäringusse.</p></div><div class="card"><h3>Sina lisad kodu</h3><p class="muted">Vali või lisa ning kinnita kodu, mida soovid kindlustada</p></div><div class="card"><h3>Otsustad ise</h3><p class="muted">Kasuta personaalset koodi ja esita taotlus valitud seltsis.</p></div></div>`;
if(page==='homes')html=steps(0)+`<div class="intro"><h1>Millist kodu soovid kindlustada?</h1><p class="muted">Kinnita enda kindlustatava kodu aadress. Osalemissoov ei sõlmi kindlustuslepingut.</p></div>`+member()+home(homes[0])+`<div class="notice"><label class="choice"><input type="checkbox" ${addressConsent?'checked':''} onchange="addressConsent=this.checked;render()"><span>Ma luban kasutada Tulevale teadaolevat aadressi soodsama kodukindlustuse läbirääkimiseks.</span></label></div>`+`<div class="notice"><h3>Soovid kindlustada teist kodu?</h3><p class="muted">Sinu loal teeb Tuleva sinu nimel päringu kinnistusregistrisse ja kuvab sulle kuuluvad kinnistud.</p><button class="secondary" onclick="go('consent')">Leia teised kinnistud →</button></div>`+(queried?homes.slice(1).filter(h=>!h.removed).map(h=>home(h,true)).join('')+'<button class="text" onclick="restore()">Taasta eemaldatud kinnistud</button>':'')+`<div class="actions"><span class="muted">Valitud ${selected().length} kodu</span><button ${selected().length===0||(homes[0].selected&&!addressConsent)?'disabled':''} onclick="go('review')">Jätka osalemissooviga →</button></div>`;
if(page==='consent')html=steps(0)+`<button class="text" onclick="go('homes')">← Tagasi kodude juurde</button><h1 style="margin-top:20px">Sinu kinnistud,<br>sinu nõusolekul.</h1>`+member()+`<div class="home"><h3>Luba kinnistusregistri päringuks</h3><p class="muted">Päringu eesmärk on leida sulle kuuluvad kinnistud, et saaksid valida ühishankesse lisatavad kodud. Tuleva kasutab päringuks sinu nime ja isikukoodi.</p><label class="choice"><input id="permission" type="checkbox" ${consent?'checked':''} onchange="consent=this.checked;document.querySelector('#query').disabled=!consent"><span>Lub an Tuleval teha minu nimel kinnistusregistrisse päringu mulle kuuluvate kinnistute leidmiseks.</span></label><p class="muted" style="font-size:13px;margin-top:18px">Demo: päring tagastab 3 väljamõeldud kinnistut. Ühtegi päringut päris registrisse ei saadeta.</p><button id="query" ${consent?'':'disabled'} onclick="queryRegistry()">Anna luba ja leia kinnistud →</button></div>`;
if(page==='review')html=steps(1)+`<h1>Kinnita osalemissoov</h1><p class="muted">Need ${selected().length} kodu lisame ühise pakkumise küsimisse.</p>`+selected().map(h=>`<div class="home"><h3>⌂ ${h.address}</h3><span class="muted">${h.type} · ${h.area} m²</span></div>`).join('')+`<div class="notice"><label class="choice"><input type="checkbox" onchange="accepted=this.checked;document.querySelector('#submit').disabled=!accepted" ${accepted?'checked':''}><span>Kinnitan, et soovin valitud kodudega ühishankes osaleda ja luban kasutada valitud kodude andmeid ühise pakkumise küsimiseks.</span></label></div><div class="actions"><button class="secondary" onclick="go('homes')">← Muuda kodude valikut</button><button id="submit" ${accepted?'':'disabled'} onclick="go('success')">Esita osalemissoov →</button></div>`;
if(page==='success')html=steps(2)+`<div class="success">✓</div><h1>Tõnu, sinu soov on vastu võetud.</h1><p class="muted">Tuleva liidab sinu ${selected().length} kodu kindlustamise soovi ühisesse pakkumise küsimisse.</p><div class="code"><div><span>Sinu personaalne sooduskood · 25%</span><br><strong>${code}</strong><br><small>Demokood · tegelik soodustus sõltub pakkumise tingimustest</small></div><button class="secondary" onclick="copyCode()">Kopeeri kood</button></div><h2>Vali kindlustusselts</h2><p class="muted">Kindlustuse vormid täidad kindlustusseltsi lehel. Vali If, et liikuda eraldi Ifi näidislehele: andmed ja sooduskood on eeltäidetud.</p><div class="insurers">`+['Salva','ELAMA','Seesam','PZU','IF','Ergo'].map(c=>`<button class="insurer" onclick="company='${c}';go('insurer')"><strong>${c==='IF'?'if':c}</strong><small>${c==='IF'?'Jätka Ifi näidislehel':'Ava seltsi näidisvaade'} ↗</small></button>`).join('')+'</div>';
if(page==='insurer'&&company!=='IF')html=steps(3)+`<button class="text" onclick="go('success')">← Tagasi seltside juurde</button><div class="home"><span class="pill">SE LTSI LEHE DEMO</span><h1 style="margin-top:20px">${company}</h1><p>Jätkad kindlustustaotlusega seltsi veebilehel.</p><p>Sinu personaalne kood: <b>${code}</b></p><p class="muted">See on suunamise näidis. Täieliku vormi läbimängimiseks vali If.</p><button onclick="company='IF';go('insurer')">Ava Ifi näidistaotlus →</button></div>`;
if(page==='insurer'&&company==='IF')html=`<button class="text" onclick="go('success')">← Tagasi seltside juurde</button><div class="home"><div class="home-top"><div class="iflogo">if</div><span class="pill">IFI LEHE NÄIDIS · MITTEAMETLIK</span></div><h2>Kodukindlustuse taotlus</h2><p class="muted">Oled liikunud Tuleva lehelt Ifi eraldi näidisvaatesse. Taotleja näidisandmed, valitud kodud ja personaalne sooduskood on vormis täidetud.</p><form onsubmit="event.preventDefault();go('done')"><div class="formgrid"><label>Ees- ja perekonnanimi<input required value="Tõnu Pekk" autocomplete="off"></label><label>Isikukood (väljamõeldud)<input required value="60001019999" pattern="[0-9]{11}" autocomplete="off"></label><label>E-post<input required type="email" value="tonu.pekk@example.com" autocomplete="off"></label><label>Telefon<input required type="tel" value="+372 5550 0123" autocomplete="off"></label></div>`+selected().map(h=>`<div class="home"><h3>${h.address}</h3><div class="formgrid"><label>Kinnisvara liik<select><option>${h.type}</option><option>Korter</option><option>Eramu</option><option>Suvila</option></select></label><label>Pindala (m²)<input required type="number" min="1" value="${h.area}"></label></div></div>`).join('')+`<div class="formgrid"><label>Kindlustuskaitse<select><option>Hoone / korter ja kodune vara</option><option>Ainult hoone / korter</option></select></label><label>Personaalne sooduskood<input required value="${code}" readonly></label></div><div class="notice"><b>✓ Tuleva demokood on lisatud · 25% näidissoodustus</b><br><small>Lõplik hind kuvatakse seltsi pakkumises. Siin hinda ei arvutata.</small></div><label class="choice"><input required type="checkbox"><span>Kinnitan näidisandmed ja soovin saada kindlustuspakkumist.</span></label><button style="margin-top:24px" type="submit">Esita näidistaotlus →</button></form></div>`;
if(page==='done')html=steps(3)+`<div class="success">✓</div><h1>Näidistaotlus on esitatud.</h1><p class="muted">Tõnu Peki ${selected().length} kodu andmed ja sooduskood <b>${code}</b> on Ifi näidistaotluses.</p><div class="notice">Teekond on läbi mängitud. Andmeid ei saadetud Tulevale, kinnistusregistrisse ega Ifile.</div><button onclick="reset()">Mängi läbi teine juhtum ↻</button>`;
app.innerHTML=html.replace('Lub an','Luban').replace('SE LTSI','SELTSI');}
function restore(){homes.slice(1).forEach(h=>h.removed=false);render()}function queryRegistry(){if(!consent)return;const b=document.querySelector('#query');b.disabled=true;b.textContent='Otsin kinnistuid…';setTimeout(()=>{queried=true;go('homes');toast('Leidsime 3 kinnistut · registri näidisvastus')},800)}async function copyCode(){try{await navigator.clipboard.writeText(code);toast('Sooduskood kopeeritud')}catch{toast('Sinu kood: '+code)}}render();
</script></body></html>
