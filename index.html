<script>
const app=document.querySelector('#app');let page='landing',addressConsent=false,consent=false,queried=false,accepted=false,company='If',sessionEnded=false,registryExpanded=false;const code='TULEVA-MARI-25';const homes=[{id:0,address:'Pärnaõie tn 18–7, Tallinn',type:'Korter',area:68,selected:false,removed:false},{id:1,address:'Kadakamarja tee 24, Tartu',type:'Eramu',area:124,selected:true,removed:false},{id:2,address:'Rannakivi põik 6–12, Pärnu',type:'Korter',area:54,selected:true,removed:false},{id:3,address:'Metsaoja tee 9, Viljandi vald',type:'Suvila',area:46,selected:false,removed:false}];

const insurers=[

function endSession(){sessionEnded=true;addressConsent=false;consent=false;queried=false;accepted=false;homes.forEach(h=>{h.selected=false;h.removed=false});page='signedout';history.replaceState(null,'',location.pathname+location.search+'#signedout');render();document.querySelector('#toast').style.display='none';}
window.addEventListener('pageshow',()=>{if(sessionEnded||location.hash==='#signedout'){page='signedout';render();}});
function go(p){page=p;location.hash=p;render();window.scrollTo(0,0)}function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',2600)}
function steps(n){return '<div class="steps">'+['Kodu ja osalemissoov','Sooduskood ja selts'].map((x,i)=>`<span class="${i===n?'active':''}">${i+1}. ${x}</span>`).join('')+'</div>'}function member(){return '<div class="member"><div class="avatar">MM</div><div><b>Mari Maasikas</b> <span class="pill">Tuleva liige</span><br><small class="muted">Isikukood: 60001019999 · väljamõeldud demoandmed</small></div></div>'}
function selected(){return homes.filter(h=>h.selected&&!h.removed&&(h.id===0||queried))}function home(h,registry=false){return `<div class="home ${h.selected?'selected':''}"><div class="home-top"><div class="address">⌂ ${h.address}</div>${registry?`<button class="text danger" onclick="removeHome(${h.id})">Eemalda</button>`:'<span class="pill">Minu aadress</span>'}</div><div class="details">${h.type} · ${h.area} m² · ${registry?'kinnistusregistri näidisvastus':'liikmeprofiili näidisandmed'}</div><label class="choice"><input type="checkbox" ${h.selected?'checked':''} onchange="choose(${h.id},this.checked)"><span>Soovin seda kodu kindlustada ja luban aadressi kasutada soodsama kodukindlustuse läbirääkimiseks.</span></label></div>`}function choose(id,v){homes[id].selected=v;if(id===0)addressConsent=v;render()}function removeHome(id){homes[id].removed=true;homes[id].selected=false;render()}function reset(){registryExpanded=false;sessionEnded=false;addressConsent=false;consent=false;queried=false;accepted=false;homes.forEach((h,i)=>{h.removed=false;h.selected=i===1||i===2});go('landing')}
function render(){document.querySelector('#service-name').hidden=page==='landing'||page==='signedout';document.querySelector('#account').innerHTML=(page==='landing'||page==='signedout')?'<button class="secondary" onclick="go(\'homes\')">Logi sisse</button>':'<span>● Mari Maasikas</span> <button class="text" onclick="reset()">Alusta uuesti</button>';let html='';
if(page==='landing')html=`<div class="hero"><div><span class="pill">TULEVA LIIKMETELE</span><h1 style="margin-top:24px">Kodukindlustus.<br>Ühiselt soodsam.</h1><p class="muted">Ühendame ostujõu. Kindlustame kodud soodsamalt.</p><button onclick="go('homes')">Logi sisse ja osale →</button><p style="font-size:12px;margin-top:12px" class="muted">Demo sisselogimine Mari Maasikana</p></div><div class="house"><svg viewBox="0 0 350 300" aria-label="Kodu illustratsioon"><circle cx="175" cy="150" r="140" fill="#daeeff"/><path d="M50 260h260" stroke="#8bc9dc" stroke-width="4"/><path d="M83 145L176 57l95 88" fill="none" stroke="#0a397c" stroke-width="14" stroke-linejoin="round"/><path d="M98 136l78-72 79 72v124H98z" fill="white"/><path d="M176 64l79 72v124h-79z" fill="#f0f7ff"/><path d="M220 90V52h20v57" fill="#0a397c"/><path d="M145 202h43v58h-43z" fill="#0067ff"/><g fill="#a5d9ff" stroke="#0067ff" stroke-width="3"><path d="M128 143h28v35h-28zM205 143h28v35h-28zM208 207h25v31h-25z"/></g><path d="M285 257v-94" stroke="#14747c" stroke-width="5"/><ellipse cx="285" cy="154" rx="31" ry="56" fill="#78cbb7"/><path d="M285 225v-80" stroke="#14747c" stroke-width="3"/><circle cx="78" cy="247" r="25" fill="#68bfae"/><circle cx="273" cy="254" r="18" fill="#18a1b1"/></svg></div></div><div class="metrics"><div class="metric"><strong>1000+</strong>liiget on esmane eesmärk</div><div class="metric"><strong>25%</strong>näidissoodustus liikmele</div><div class="metric"><strong>5</strong>kindlustusseltsi valikus</div></div><div class="cards" style="margin-top:24px"><div class="card"><h3>Ühine ostujõud</h3><p class="muted">Koondame liikmete soovid ühte pakkumispäringusse.</p></div><div class="card"><h3>Sina lisad kodu</h3><p class="muted">Vali või lisa ning kinnita kodu, mida soovid kindlustada</p></div><div class="card"><h3>Otsustad ise</h3><p class="muted">Kasuta personaalset koodi ja esita taotlus valitud seltsis.</p></div></div>`;
if(page==='homes')html=steps(0)+`<div class="intro"><h1>Millist kodu soovid kindlustada?</h1><p class="muted">Kinnita enda kindlustatava kodu aadress. Osalemissoov ei sõlmi kindlustuslepingut.</p></div>`+member()+home(homes[0])+(!queried?`<div class="registry"><button class="text" onclick="registryExpanded=!registryExpanded;render()" aria-expanded="${registryExpanded}">${registryExpanded?'−':'+'} Soovin lisada teise kodu</button>${registryExpanded?`<p class="muted">Leiame sinu loal kinnistusregistrist sulle kuuluvad kinnistud.</p><label class="choice"><input type="checkbox" ${consent?'checked':''} onchange="consent=this.checked;render()"><span>Luban Tuleval teha minu nimel kinnistusregistrisse päringu mulle kuuluvate kinnistute leidmiseks.</span></label><button id="query" class="secondary" style="margin-top:16px" ${consent?'':'disabled'} onclick="queryRegistry()">Leia minu kinnistud</button>`:''}</div>`:homes.slice(1).filter(h=>!h.removed).map(h=>home(h,true)).join('')+'<button class="text" onclick="restore()">Taasta eemaldatud kinnistud</button>')+`<div class="participation"><div class="actions"><span class="muted">Valitud ${selected().length} kodu</span><button ${selected().length===0||(homes[0].selected&&!addressConsent)?'disabled':''} onclick="submitParticipation()">Esita osalemissoov →</button></div></div>`;
if(page==='success')html=steps(1)+`<div class="success">✓</div><h1>Mari, sinu soov on vastu võetud.</h1><p class="muted">Tuleva liidab sinu ${selected().length} kodu kindlustamise soovi ühisesse pakkumise küsimisse.</p><div class="code"><div><span>Sinu personaalne sooduskood · 25%</span><br><strong>${code}</strong><br><small>Demokood · tegelik soodustus sõltub pakkumise tingimustest</small></div><button class="secondary" onclick="copyCode()">Kopeeri kood</button></div><h2>Vali kindlustusselts</h2><p class="muted">Pakkumise küsimist ja vormide täitmist jätkad kindlustusseltsi veebilehel. Kopeeri sooduskood enne jätkamist.</p><div class="exit-note"><b>Tulevas on kõik tehtud.</b> Kindlustusseltsi valides logime sind Tulevast välja. Pakkumise küsimist jätkad seltsi veebilehel.<br><small>Sooduskoodi ja koduandmeid lingiga kaasa ei saadeta.</small></div><div class="insurers">`+insurers.map((c,i)=>c.name==='If'?`<div class="insurer insurer-${i}"><strong>${c.name}</strong><span>Kodukindlustus</span><small>Veebilehele suunamine puudub</small></div>`:`<a class="insurer insurer-${i}" href="${c.url}" rel="noreferrer" onclick="endSession()"><strong>${c.name}</strong><span>Kodukindlustus</span><small>Logi välja ja jätka ↗</small></a>`).join('')+'</div>';
if(page==='signedout')html=`<div class="success">✓</div><h1>Oled Tulevast välja logitud.</h1><p class="muted">Pakkumise küsimist saad jätkata kindlustusseltsi veebilehel. Tulevasse naasmiseks logi uuesti sisse.</p><button onclick="reset();go('homes')">Logi uuesti sisse</button>`;
app.innerHTML=html.replace('Lub an','Luban').replace('SE LTSI','SELTSI');}
function submitParticipation(){if(!selected().length||(homes[0].selected&&!addressConsent))return;accepted=true;go('success')}
function restore(){homes.slice(1).forEach(h=>h.removed=false);render()}function queryRegistry(){if(!consent)return;const b=document.querySelector('#query');b.disabled=true;b.textContent='Otsin kinnistuid…';setTimeout(()=>{queried=true;go('homes');toast('Leidsime 3 kinnistut · registri näidisvastus')},800)}async function copyCode(){try{await navigator.clipboard.writeText(code);toast('Sooduskood kopeeritud')}catch{toast('Sinu kood: '+code)}}render();
</script></body></html>
